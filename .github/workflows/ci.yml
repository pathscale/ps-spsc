name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabi
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release

      # The crate is #![no_std]; a bare-metal target is the only thing that
      # actually proves it, since a host build links std through the tests.
      - run: cargo build --target thumbv7em-none-eabi

  miri:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2

      # The queue is a hand-written ring: pop_n does raw segmented copies and Drop
      # deallocates by hand. A native run cannot see an out-of-bounds read there,
      # and did not: planting `let (lo, hi) = (s, d)` in the equivalent st3 path
      # was a bare SIGBUS natively and a located diagnostic under Miri.
      #
      # Fixtures are sized by cfg(miri) so this stays a few seconds, not minutes.
      - run: cargo miri test --lib
