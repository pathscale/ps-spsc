name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabi
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release

      # The crate is #![no_std]; a bare-metal target is the only thing that
      # actually proves it, since a host build links std through the tests.
      - run: cargo build --target thumbv7em-none-eabi

  miri:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2

      # The queue is a hand-written ring with raw pointer copies in pop_n and
      # a manual dealloc in Drop. Native tests do not see a mistake there.
      - run: cargo miri test --lib
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
