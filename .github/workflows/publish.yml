name: Publish

# Publishing is irreversible: a version can never be reused and yanking does
# not delete. This fires only when the version in Cargo.toml changes on the
# default branch, and it runs after CI has passed on the same commit.
on:
  push:
    branches: [master]
    paths: ['Cargo.toml']

jobs:
  publish:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable

      - id: version
        run: |
          new=$(sed -nE '0,/^version = "(.*)"/s//\1/p' Cargo.toml)
          old=$(git show HEAD~1:Cargo.toml | sed -nE '0,/^version = "(.*)"/s//\1/p')
          echo "new=$new" >> "$GITHUB_OUTPUT"
          if [ "$new" = "$old" ]; then
            echo "version unchanged at $new, nothing to publish"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "version $old -> $new"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.changed == 'true'
        run: cargo publish --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - if: steps.version.outputs.changed == 'true'
        run: |
          git tag "v${{ steps.version.outputs.new }}"
          git push origin "v${{ steps.version.outputs.new }}"
